name: NVG Verification CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          constraints-python312.txt

    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt -c constraints-python312.txt
        python -m pip check

    - name: Run canonical scientific verification front door
      run: |
        python verification/run_verification.py
